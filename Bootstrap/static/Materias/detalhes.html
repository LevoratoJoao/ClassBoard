<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalhes da Matéria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="bg-fundo"></div>
  <nav class="navbar bg-body-tertiary navbar-expand-lg py-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="../Inicial/inicial.html"><img src="../../src/images/logo.png" alt="Logo" style="height: 64px" /></a>
      <ul class="nav nav-fill fs-5">
        <li class="nav-item">
          <a class="nav-link active montserrat-bold" aria-current="page" href="../Turma/detalhesTurma.html">Turma</a>
        </li>
        <li class="nav-item ms-3">
          <a class="nav-link montserrat-bold" href="listagem.html">Matérias</a>
        </li>
        <li class="nav-item ms-3">
          <a class="nav-link montserrat-bold" href="../Alunos/listagemAlunos.html">Alunos</a>
        </li>
        <li class="nav-item ms-3">
          <a class="nav-link disabled montserrat-bold" aria-disabled="true">Relatório</a>
        </li>
      </ul>
      <button type="button" class="btn btn-upload montserrat-bold fs-5 px-4 py-2 me-2">
        <img src="../../src/images/grafico.webp" alt="Grafico" style="
              height: 32px;
              width: 32px;
              margin-right: 10px;
              vertical-align: middle;
            " />
        Upload
      </button>
    </div>
  </nav>
  <div class="container mt-5">
    <h1 id="materia-title" class="mb-4 text-center"></h1>
  </div>


  <div class="container mt-5">
    <h1 id="aluno-title" class="mb-4 text-center"></h1>
    <div class="row mb-4">
      <div class="col">
        <div class="card mb-3">
          <div class="card-body">
            <h5 class="card-title text-center">Avaliações passadas</h5>
            <ul id="avaliacoes-list" class="list-group"></ul>
          </div>
        </div>
      </div>
    </div>
    <div class="row mb-4">
      <div class="col-md-6">
        <div class="card mb-3">
          <div class="card-body d-flex align-items-center justify-content-between">
            <div>
              <h5 class="card-title">Media total</h5>
              <span id="media-total" class="fs-4"></span>
            </div>
            <img src="../../src/images/falta.webp" alt="Faltas" style="height:80px;width:80px;object-fit:contain;">
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card mb-3">
          <div class="card-body d-flex align-items-center justify-content-between">
            <div>
              <h5 class="card-title">Ranking da materia</h5>
              <span id="ranking-materia" class="fs-4"></span>
            </div>
            <img src="../../src/images/trofeu.webp" alt="Troféu" style="height:80px;width:80px;object-fit:contain;">
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="container mt-4 mb-5">
    <div class="row">
      <div class="col-md-3">
        <div class="card h-80">
          <div class="card-body">
            <h5 class="card-title text-center">Filtros</h5>
            <hr />
            <div class="d-flex flex-column align-items-start">
              <div class="mb-3 w-100">
                <label class="form-label mb-2">Bimestre</label>
                <div id="bimestreFilter" class="d-flex flex-column">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="bimestre" id="bimestreAll" value="All" checked />
                    <label class="form-check-label" for="bimestreAll">Todos</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="bimestre" id="bimestre1" value="1" />
                    <label class="form-check-label" for="bimestre1">1º Bimestre</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="bimestre" id="bimestre2" value="2" />
                    <label class="form-check-label" for="bimestre2">2º Bimestre</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="bimestre" id="bimestre3" value="3" />
                    <label class="form-check-label" for="bimestre3">3º Bimestre</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="bimestre" id="bimestre4" value="4" />
                    <label class="form-check-label" for="bimestre4">4º Bimestre</label>
                  </div>
                </div>
              </div>
              <div class="mb-3 w-100">
                <label class="form-label mb-2">Tipo de Avaliação</label>
                <div id="tipoFilter" class="d-flex flex-column">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipo" id="tipoAll" value="All" checked />
                    <label class="form-check-label" for="tipoAll">Todos</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipo" id="tipoProva" value="Prova" />
                    <label class="form-check-label" for="tipoProva">Prova</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipo" id="tipoTrabalho" value="Trabalho" />
                    <label class="form-check-label" for="tipoTrabalho">Trabalho</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipo" id="tipoRecuperacao" value="Recuperação" />
                    <label class="form-check-label" for="tipoRecuperacao">Recuperação</label>
                  </div>
                </div>
              </div>
              <button id="applyFilters" class="btn w-100 mt-2 applyFilters" onclick="applyFilters()">
                Aplicar Filtros
              </button>
              <button id="clearFilters" class="btn w-100 mt-2 clearFilters" onclick="clearFilters()">
                Limpar Filtros
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-9">
        <div class="card mb-4" style="max-height: 512px; overflow-y: auto">
          <div class="card-body">
            <h5 class="card-title text-center">Gráficos</h5>
            <!-- <p class="card-text">Aqui você irá ver gráficos relacionados à matéria.</p> -->
            <hr />
            <div class="d-flex flex-column align-items-center">
              <div class="mb-4 d-flex flex-column align-items-center">
                <h6>Notas Gerais</h6>
                <canvas id="media_notas" width="800" height="400"></canvas>
              </div>
              <div class="mb-4 d-flex flex-column align-items-center">
                <h6>Evolução das notas</h6>
                <canvas id="notas_avaliacoes" width="700" height="400"></canvas>
              </div>
              <div class="mb-4 d-flex flex-column align-items-center">
                <h6>Notas pela quantidade de alunos</h6>
                <canvas id="notas_alunos" width="700" height="400"></canvas>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Análise da IA</h5>
            <div id="ai-summary" class="mt-3"></div>
            <div id="ai-comment" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../../src/scriptMateria.js"></script>
</body>

</html>
