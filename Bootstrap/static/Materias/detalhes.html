<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhes da Matéria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <nav class="navbar bg-body-tertiary navbar-expand-lg py-3">
    <div class="container-fluid">
      <a class="navbar-brand montserrat-bold fs-2">ClassBoard</a>
      <ul class="nav nav-fill fs-5">
        <li class="nav-item">
          <a class="nav-link active montserrat-bold" aria-current="page" href="#">Turma</a>
        </li>
        <li class="nav-item ms-3">
          <a class="nav-link montserrat-bold" href="listagem.html">Matéria</a>
        </li>
        <li class="nav-item ms-3">
          <a class="nav-link montserrat-bold" href="#">Alunos</a>
        </li>
        <li class="nav-item ms-3">
          <a class="nav-link disabled montserrat-bold" aria-disabled="true">Relatório</a>
        </li>
      </ul>
      <button type="button" class="btn btn-info montserrat-bold fs-5 px-4 py-2">Upload</button>
    </div>
  </nav>
  <div class="container mt-5">
    <h1 id="materia-title" class="mb-4 text-center"></h1>
    <div id="materia-details" class="text-center"></div>
  </div>

  <div class="container mt-4 mb-5">
    <div class="row">
      <div class="col-md-3">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title text-center
            ">Filtros</h5>

            <div class="d-flex flex-column align-items-start">
              <div class="mb-3 w-100">
                <label for="bimestreFilter" class="form-label">Bimestre</label>
                <select id="bimestreFilter" class="form-select">
                  <option value="All" selected>Todos</option>
                  <option value="1">1º Bimestre</option>
                  <option value="2">2º Bimestre</option>
                  <option value="3">3º Bimestre</option>
                  <option value="4">4º Bimestre</option>
                </select>
              </div>
              <div class="mb-3 w-100">
                <label for="tipoFilter" class="form-label">Tipo de Avaliação</label>
                <select id="tipoFilter" class="form-select">
                  <option value="All" selected>Todos</option>
                  <option value="Prova">Prova</option>
                  <option value="Trabalho">Trabalho</option>
                  <option value="Recuperação">Recuperação</option>
                </select>
              </div>
              <button id="applyFilters" class="btn btn-primary w-100 mt-2" onclick="applyFilters()">Aplicar
                Filtros</button>
              <button id="clearFilters" class="btn btn-secondary w-100 mt-2" onclick="clearFilters()">Limpar
                Filtros</button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-9">
        <div class="card mb-4" style="max-height: 500px; overflow-y: auto;">
          <div class="card-body">
            <h5 class="card-title text-center">Gráficos</h5>
            <!-- <p class="card-text">Aqui você irá ver gráficos relacionados à matéria.</p> -->
            <hr>
            <div class="d-flex flex-column align-items-center">
              <div class="mb-4 d-flex flex-column align-items-center">
                <h6>Notas Gerais</h6>
                <canvas id="media_notas" width="800" height="400"></canvas>
              </div>
              <div class="mb-4 d-flex flex-column align-items-center">
                <h6>Distribuição de Notas por avaliação</h6>
                <canvas id="notas_avaliacoes" width="800" height="400"></canvas>
              </div>
              <div class="mb-4 d-flex flex-column align-items-center">
                <h6>Média por Avaliação</h6>
                <canvas id="averageByEvaluationChart" width="400" height="200"></canvas>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Análise da IA</h5>
            <p class="card-text">Aqui você irá ver a análise gerada pela IA.</p>
            <div id="ai-summary" class="mt-3"></div>
            <div id="ai-comment" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../../src/script.js"></script>
</body>

</html>
