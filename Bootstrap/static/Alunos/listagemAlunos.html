<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listagem de Alunos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=person,school,star"
    />
  </head>

  <body>
    <div class="bg-fundo"></div>
    <nav class="navbar bg-body-tertiary navbar-expand-lg py-3">
      <div class="container-fluid">
        <a class="navbar-brand" href="../Inicial/inicial.html"
          ><img src="../../src/images/logo.png" alt="Logo" style="height: 64px"
        /></a>
        <ul class="nav nav-fill fs-5">
          <li class="nav-item">
            <a
              class="nav-link active montserrat-bold"
              aria-current="page"
              href="../Turma/detalhesTurma.html"
              >Turma</a
            >
          </li>
          <li class="nav-item ms-3">
            <a class="nav-link montserrat-bold" href="../Materias/listagem.html"
              >Matérias</a
            >
          </li>
          <li class="nav-item ms-3">
            <a class="nav-link montserrat-bold" href="#">Alunos</a>
          </li>
          <li class="nav-item ms-3">
            <a class="nav-link disabled montserrat-bold" aria-disabled="true"
              >Relatório</a
            >
          </li>
        </ul>
        <button
          type="button"
          class="btn btn-upload montserrat-bold fs-5 px-4 py-2 me-2"
        >
          <img
            src="../../src/images/grafico.webp"
            alt="Brain"
            style="
              height: 32px;
              width: 32px;
              margin-right: 10px;
              vertical-align: middle;
            "
          />
          Upload
        </button>
      </div>
    </nav>
    <div class="container mt-5">
      <h1 class="mb-4 text-center montserrat-bold">Alunos da turma</h1>
      <div class="row justify-content-center mb-4">
        <ul id="lista-alunos" class="list-group mb-4"></ul>
      </div>
      <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
      ></script>
      <script type="module">
        import { alunos } from "../../src/data/alunos.js";
        const lista = document.getElementById("lista-alunos");
        alunos.forEach((aluno, idx) => {
          const li = document.createElement("li");
          li.className = "list-group-item d-flex align-items-center";
          let iconHtml = "";
          if (aluno.sexo === "feminino") {
            iconHtml = `<img src="../../src/images/girl.webp" alt="Feminino" style="height:3rem;width:3rem;object-fit:contain;margin-right:12px;">`;
          } else {
            iconHtml = `<img src="../../src/images/boy.webp" alt="Masculino" style="height:3rem;width:3rem;object-fit:contain;margin-right:12px;">`;
          }
          li.innerHTML = `
                    ${iconHtml}
                    <a class="montserrat-bold fs-4 text-decoration-none" href="detalhesAlunos.html?aluno=${encodeURIComponent(
                      aluno.nome
                    )}">${aluno.nome}</a>
                `;
          lista.appendChild(li);
        });
      </script>
    </div>
    <footer class="text-center py-4" style="background: transparent">
      <img
        src="../../src/images/alunos.webp"
        alt="Alunos"
        style="height: 250px; width: 250px; object-fit: contain; margin-top: 0px;"
      />
    </footer>
  </body>
</html>
